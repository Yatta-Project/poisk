name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-fedora-rpm:
    name: Build Fedora RPM
    runs-on: ubuntu-latest
    container:
      image: fedora:41
    steps:
      - name: Install dependencies
        run: |
          dnf install -y \
            meson ninja-build gcc vala pkgconfig \
            glib2-devel gobject-introspection-devel \
            gtk4-devel libadwaita-devel granite7-devel \
            json-glib-devel sqlite-devel wayland-devel gtk4-devel \
            systemd-rpm-macros rpm-build git tar xz

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Create Source Tarball
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF_NAME" ]; then
            VERSION="1.0.0"
          fi
          mkdir -p /root/rpmbuild/SOURCES
          git archive --format=tar.gz --prefix="poisk-${VERSION}/" HEAD > "/root/rpmbuild/SOURCES/poisk-${VERSION}.tar.gz"
          # Also create .tar.xz
          tar -czf "/root/rpmbuild/SOURCES/poisk-${VERSION}.tar.gz" --exclude=.git --transform "s,^,poisk-${VERSION}/," .

      - name: Build RPM
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF_NAME" ]; then
            VERSION="1.0.0"
          fi
          sed -i "s/^Version:.*/Version:        ${VERSION}/" packaging/poisk.spec
          sed -i "s/\.tar\.xz/\.tar\.gz/" packaging/poisk.spec
          rpmbuild -ba packaging/poisk.spec
          mkdir -p dist
          cp /root/rpmbuild/RPMS/*/*.rpm dist/ || true
          cp /root/rpmbuild/SRPMS/*.rpm dist/ || true

      - name: Upload RPM Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fedora-rpm
          path: dist/*.rpm

  build-ubuntu-deb:
    name: Build Ubuntu/elementary DEB
    runs-on: ubuntu-latest
    container:
      image: ubuntu:24.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install dependencies
        run: |
          apt-get update && apt-get install -y \
            build-essential debhelper meson ninja-build valac pkg-config \
            libglib2.0-dev libgtk-4-dev libadwaita-1-dev libgranite-7-dev \
            libjson-glib-dev libsqlite3-dev libwayland-dev git dpkg-dev

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build DEB package
        run: |
          mkdir -p debian
          cp -r packaging/debian/* debian/
          chmod +x debian/rules
          dpkg-buildpackage -b -uc -us
          mkdir -p dist
          cp ../*.deb dist/ || true

      - name: Upload DEB Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-deb
          path: dist/*.deb

  build-gnome-extension:
    name: Package GNOME Extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zip extension
        run: |
          mkdir -p dist
          cd data/gnome-shell-extension
          zip -r ../../dist/poisk-blur@mrlogiousbanana.github.io.zip .
      - name: Upload Extension Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gnome-extension
          path: dist/*.zip

  create-release:
    name: Create GitHub Release
    needs: [build-fedora-rpm, build-ubuntu-deb, build-gnome-extension]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          name: Poisk ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
