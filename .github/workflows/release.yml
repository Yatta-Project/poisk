name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-fedora-rpm:
    name: Build Fedora RPM
    runs-on: ubuntu-latest
    container:
      image: fedora:41
    steps:
      - name: Install dependencies
        run: |
          dnf install -y \
            meson ninja-build gcc vala pkgconfig sassc \
            glib2-devel gobject-introspection-devel libgee-devel \
            gtk4-devel libadwaita-devel \
            json-glib-devel sqlite-devel wayland-devel \
            systemd-rpm-macros rpm-build git tar xz

      - name: Ensure Granite 7
        run: |
          if ! pkg-config --exists granite-7; then
            echo "Building Granite 7 from upstream..."
            git clone --depth 1 --branch 7.5.0 https://github.com/elementary/granite.git /tmp/granite
            meson setup /tmp/granite/build /tmp/granite --prefix=/usr
            ninja -C /tmp/granite/build install
          fi

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Create Source Tarball
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF_NAME" ]; then
            VERSION="1.0.0"
          fi
          SOURCEDIR="$(rpm --eval '%_sourcedir')"
          mkdir -p "${SOURCEDIR}"
          tar -czf "${SOURCEDIR}/poisk-${VERSION}.tar.gz" --exclude=.git --transform "s,^,poisk-${VERSION}/," .

      - name: Build RPM
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF_NAME" ]; then
            VERSION="1.0.0"
          fi
          sed -i "s/^Version:.*/Version:        ${VERSION}/" packaging/poisk.spec
          sed -i "s/\.tar\.xz/\.tar\.gz/" packaging/poisk.spec
          rpmbuild -bb packaging/poisk.spec --nodeps
          RPMDIR="$(rpm --eval '%_rpmdir')"
          mkdir -p dist
          cp "${RPMDIR}"/*/*.rpm dist/ || true

      - name: Upload RPM Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fedora-rpm
          path: dist/*.rpm

  build-ubuntu-deb:
    name: Build Ubuntu/elementary DEB
    runs-on: ubuntu-latest
    container:
      image: ubuntu:24.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install dependencies
        run: |
          apt-get update && apt-get install -y \
            build-essential debhelper meson ninja-build valac pkg-config \
            libglib2.0-dev libgtk-4-dev libadwaita-1-dev libgranite-7-dev \
            libjson-glib-dev libsqlite3-dev libwayland-dev git dpkg-dev

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build DEB package
        run: |
          mkdir -p debian
          cp -r packaging/debian/* debian/
          chmod +x debian/rules
          dpkg-buildpackage -b -uc -us
          mkdir -p dist
          cp ../*.deb dist/ || true

      - name: Upload DEB Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-deb
          path: dist/*.deb

  build-gnome-extension:
    name: Package GNOME Extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zip extension and tarball
        run: |
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF_NAME" ]; then
            VERSION="1.0.0"
          fi
          cd data/gnome-shell-extension
          zip -r ../../dist/poisk-blur@mrlogiousbanana.github.io.zip .
          cd ../..
          tar -czf "dist/poisk-${VERSION}.tar.gz" --exclude=.git --transform "s,^,poisk-${VERSION}/," .
      - name: Upload Extension Artifact
        uses: actions/upload-artifact@v4
        with:
          name: extension-and-source
          path: dist/*

  create-release:
    name: Create GitHub Release
    needs: [build-fedora-rpm, build-ubuntu-deb, build-gnome-extension]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          tag_name: ${{ github.ref_name }}
          name: Poisk ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
